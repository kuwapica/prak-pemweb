<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan</title>
    <style>
        * {
            box-sizing: border-box; /*untuk meratakan, box menyesuaikan sama yang ditempati, stay disitu*/
        }

        .box {
            margin: 2px auto;
            max-width: 600px;
        }

        .header {
            height: 100px;
            border: 5px solid black;
        }

        .center {
            height: 400px;
            border: 2px solid black;
        }

        .footer {
            height: 50px;
            border: 8px solid black;
        }

        .header:hover, .center:hover, .footer:hover {
            border: 3px dashed black;
        }
    </style>
</head>
<body>
        <div class="box header"></div>
        <div class="box center"></div>
        <div class="box footer"></div>
</body>
</html>
