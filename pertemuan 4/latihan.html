<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan</title>
</head>
<body>
    <form name="lat" method="post" onsubmit="cek()">
        <table>
            <tr>
                <td>Nama </td>
                <td>:</td>
                <td>
                    <input type="text" id="nama" name="nama" onkeyup="cekNama()">
                </td>
            </tr>
            <tr></tr>
                <td>Email </td>
                <td>:</td>
                <td>
                    <input type="email" id="email" name="email">
                </td>
            </tr>
            <tr></tr>
                <td>Komentar</td>
                <td>:</td>
                <td>
                    <textarea type="text" id="komentar" name="komentar" rows="10" cols="45"></textarea>
                </td>
            </tr>
            <tr></tr>
                <td>
                    <input type="submit" id="submit" name="submit" value="Simpan"> 
                </td>
            </tr>
        </table>
    </form>
    <script>
            var fieldnama = document.getElementById("nama");
            var fieldemail = document.getElementById("email");
            var fieldkomentar = document.getElementById("komentar");

        function cekNama() {
            let regex = new RegExp("^[A-Z a-z]+$"); /*^ = negasi, */
            if (!regex.test(fieldnama.value) && fieldnama.value != "") {
                alert("Nama tidak boleh memiliki angka atau simbol!");
                fieldnama.value = fieldnama.value.replace(/[^A-Z a-z]/g, '');
            }
        }
        function cek() {
            if (fieldnama.value == "" && fieldemail.value == "" && fieldkomentar.value == "") {
                alert("Mohon isi semua input field!");
                return false;
            }
            alert("Submit form sukses");
            return true;
        }
    </script>
</body>
</html>
