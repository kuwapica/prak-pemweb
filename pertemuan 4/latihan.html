<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan</title>
</head>
<body>
    <form name="lat" method="post" onsubmit="cek()">
        <table>
            <tr>
                <td>Nama </td>
                <td>:</td>
                <td>
                    <input type="text" id="nama" name="nama" onkeyup="cekNama()">
                </td>
            </tr>
            <tr></tr>
                <td>Email </td>
                <td>:</td>
                <td>
                    <input type="email" id="email" name="email">
                </td>
            </tr>
            <tr></tr>
                <td>Komentar &nbsp;</td>
                <td>:</td>
                <td>
                    <textarea type="text" id="komentar" name="komentar" rows="10" cols="45"></textarea>
                </td>
            </tr>
            <tr></tr>
                <td>
                    <input type="submit" id="submit" name="submit" value="Simpan"> 
                </td>
            </tr>
        </table>
    </form>
    <script>
        function cek() {
            const nama = document.getElementById("nama");
            const email = document.getElementById("email");
            const komentar = document.getElementById("komentar")
            if (nama.value == "" || email.value == "" || komentar.value == "") {
                alert("Semua field harus diisi!");
                nama.focus();
                email.focus();
                komentar.focus();
                return false;
            }
            alert("Pengisian form sukses");
            return true;
        }
        function cekNama() {
            const regex = new RegExp("^") /*^ = negasi + = salah satu atau bnyk boleh, $ = utk mrngakhiri pola*/
        }
    </script>
</body>
</html>
