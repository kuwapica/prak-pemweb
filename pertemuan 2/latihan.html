<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Latihan </title>
</head>
<body>
    <form>
        <table>
            <tr>
                <td rowspan="8"><img src="download.jpeg" width="250" height="300"> </td>
            </tr>
            <tr>
                <td><label for="name">Name</label><br></td>
                <td><input type="text" id="name" name="name" value="Romi"></td>
            </tr>
            <tr>
                <td><label for="email">Email</label></td>
                <td><input type="email" id="email" name="email" value="romi@gmail.com"></td>
            </tr>
            <tr>
                <td><label for="username">Username</label></td>
                <td><input type="text" id="email" name="email" value="romi"></td>
            </tr>
            <tr>
                <td><label for="password">Password</label></td>
                <td><input type="text" id="password" style="-webkit-text-security: circle" value="1234"></td>
            </tr>
            <tr>
                <td><label for="JK">Jenis Kelamin</label></td>
                <td><select name="JK" id="JK">
                    <option value="LK">Laki-laki</option>
                    <option value="PR">Perempuan</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td><label for="alamat">Alamat</label></td>
                <td><textarea id="alamat" name="alamat" rows="10" cols="40">Bogor</textarea></td>
            </tr>
            <tr>
                <td><input type="submit" value="Simpan" id="submit" name="submit"></td>
            </tr>
        </table>
    </form>
</body>
</html>
