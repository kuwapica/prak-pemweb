<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalkulator Kembalian</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>Kalkulator Kembalian</h1>
  <div class="card">
  <div class="form-input">
    <label for="total">Total Belanja(Rp):</label>
    <input type="number" name="total" id="total">
  </div>
  <br>
  <div class="form-input">
    <label for="bayar">Uang yang Dibayarkan(Rp):</label>
    <input type="number" name="bayar" id="bayar">
  </div>
  <div style="margin-bottom: 20px;">
    <p id="hasil"></p>
  </div>
  <div class="form-input">
    <button onclick="hitung()">Hitung Kembalian</button>
  </div>
  </div>

  <script>
    function hitung() {
      var total = parseInt(document.getElementById("total").value);
      var bayar = parseInt(document.getElementById("bayar").value);
      var kembalian = bayar - total;
      
      if (kembalian < 0) {
        document.getElementById("hasil").innerText = 'Pembayaran kurang';
      } 
      else if (kembalian == 0) {
        document.getElementById("hasil").innerText = 'Uang pas';
      }
      else {
        var pecahan = [50000, 20000, 10000, 5000, 2000, 1000, 500];
        var hasil = 'Hasil Kembalian: ';
        
        for (var i = 0; i < pecahan.length; i++) {
          var jumlahPecahan = Math.floor(kembalian / pecahan[i]); 
          if (jumlahPecahan > 0) {
            hasil += jumlahPecahan + ' x Rp ' + pecahan[i] + ' '; 
            kembalian = kembalian % pecahan[i]; 
          }
        }

        if (kembalian > 0) {
          document.getElementById("hasil").innerText = 'Maaf, toko tidak memiliki pecahan uang/koin yang cukup!';
        } else {
          document.getElementById("hasil").innerText = hasil;
        }
      }
    }
  </script>
</body>
</html>
