<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BAGUS - Valorant Profile</title>
    <style>
        body {
            margin: 0;
        }

        .menu {
            list-style-type: none;
            padding: 0;
            margin-bottom: 20px;
        }

        .menu>li {
            display: inline-block;
            margin-right: 10px;
        }


        .submenu {
            display: none; /* biar ga ada/ilang*/
            list-style-type: circle;
            padding-left: 20px;
            position: absolute;
            background-color: white;
            border: 1px solid #ccc;
        }

        .menu>li:hover .submenu {
            display: block;
        }

        .box {
            width: 100%;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: black;
        }

        .box1 {
            background-color: red;
            font-weight: bold;
        }

        .box2 {
            background-color: blue;
            font-style: italic;
        }

        .box3 {
            background-color: green;
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <ul class="menu">
        <li><a href="#" style="background-color: red;">Beranda</a></li>
        <li>
            <a href="#" style="background-color: blue;">Statistik</a>
            <ul class="submenu">
                <li>Jumlah Permainan</li>
                <li>Jumlah Kemenangan</li>
                <li>Jumlah Kill</li>
                <li>Jumlah Death</li>
                <li>Jumlah Assist</li>
                <li>Persentase Headshot</li>
                <li>Persentase Clutch</li>
                <li>Persentase First Kill</li>
            </ul>
        </li>
        <li><a href="#" style="background-color: cyan;">Tentang Saya</a></li>
        <li><a href="#" style="background-color: yellow;">Kontak</a></li>
    </ul>

    <div class="box box1">BAGUS</div>
    <div class="box box2">NIM: 123456789</div>
    <div class="box box3">Rank: Gold</div>
</body>

</html>
