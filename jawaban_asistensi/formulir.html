<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .modal {
  display: none;
  position: fixed;
  z-index: 1;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  background-color: rgba(0, 0, 0, 0.5);
  justify-content: center;
  align-items: center;
}

.modal-content {
  background-color: white;
  padding: 20px;
  border-radius: 10px;
  box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
  width: 300px;
  text-align: center;
}

.close-btn {
  color: #aaa;
  float: right;
  font-size: 28px;
  font-weight: bold;
}

.close-btn:hover,
.close-btn:focus {
  color: black;
  text-decoration: none;
  cursor: pointer;
}
  </style>
</head>
<body>
  <div class="card">
    <form action="" method="post" onsubmit="return validasi()">
      <div class="form-input">
        <label for="nim">NIM</label>
        <input type="text" name="nim" id="nim">
      </div>
      <div class="form-input">
        <label for="email">Email</label>
        <input type="email" name="email" id="email">
      </div>
      <div class="form-input">
        <label for="password">Password</label>
        <input type="password" name="password" id="password">
      </div>
      <div class="form-input">
        <button type="submit">Login</button>
      </div>
    </form>
  </div>

  <div id="myModal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal()">&times;</span>
      <p>Login Berhasil!</p>
    </div>
  </div>

  <script>
    function validasi() {
      var nim = document.getElementById("nim").value;
      var email = document.getElementById("email").value;
      var password = document.getElementById("password").value;

      if (nim != "" && email != "" && password != "") {
        var nimRegex = /^[A-Z]{1}[0-9]{1}[A-Z]{1}[0-9]{6}$/;
        if (!nimRegex.test(nim)) {
          alert('NIM tidak valid!');
          return false;
        }

        var emailRegex = /^[a-z]+\.[a-z]+@mhs\.unsoed\.ac\.id$/;
        if (!emailRegex.test(email)) {
          alert('Email tidak valid! Harus menggunakan format email Unsoed.');
          return false;
        }

        var passwordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[\W_]).{8,}$/;
        if (!passwordRegex.test(password)) {
          alert('Password tidak valid! Harus minimal 8 karakter, terdapat huruf kecil, huruf besar, angka, dan simbol.');
          return false;
        }
        showModal();
        return false; 
      } else {
        alert('Anda harus mengisi data dengan lengkap!');
      }
    }

    function showModal() {
      var modal = document.getElementById("myModal");
      modal.style.display = "flex";
    }

    function closeModal() {
      var modal = document.getElementById("myModal");
      modal.style.display = "none";
    }

    window.onclick = function(event) {
      var modal = document.getElementById("myModal");
      if (event.target == modal) {
        modal.style.display = "none";
      }
    }
  </script>
</body>
</html>
